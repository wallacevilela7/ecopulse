version: '3.8'

services:
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/aws/Dockerfile
    container_name: ecopulse_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - API_SECRET_KEY=${API_SECRET_KEY:-chave-secreta-estacao-unip-2026}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ecopulse_db}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: ecopulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecopulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
