services:
  # 1. Servidor Web Nginx (Reverse Proxy + Frontend Estático + Streaming SSE)
  webserver:
    image: nginx:alpine
    container_name: ecopulse_webserver
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - ecopulse_net

  # 2. API Backend Dual-Pipeline (FastAPI + SQLAlchemy)
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/aws/Dockerfile
    container_name: ecopulse_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - API_SECRET_KEY=${API_SECRET_KEY:-chave-secreta-estacao-unip-2026}
      - COLD_PATH_WINDOW_SECONDS=${COLD_PATH_WINDOW_SECONDS:-300}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ecopulse_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecopulse_net

  # 3. Banco de Dados Relacional (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: ecopulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecopulse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecopulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecopulse_net

networks:
  ecopulse_net:
    driver: bridge

volumes:
  postgres_data:
