server {
    listen 80;
    server_name localhost _;

    # Otimização de entrega e compressão HTTP (Carregamento Ultrarrápido)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. Frontend SPA (Apple Style Dashboard)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache amigável para assets estáticos
        location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Proxy Reverso para o Backend FastAPI
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # 3. Documentação Swagger Interativa da API
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Healthcheck direto da infraestrutura
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
