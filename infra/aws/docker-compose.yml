version: '3.8'

services:
  # 1. Servidor Web Nginx (Porteiro / Reverse Proxy + Static Server)
  webserver:
    image: nginx:alpine
    container_name: ecopulse_webserver
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - ecopulse_net

  # 2. API Backend (FastAPI + SQLAlchemy)
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/aws/Dockerfile
    container_name: ecopulse_api
    restart: always
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - API_SECRET_KEY=${API_SECRET_KEY:-chave-secreta-estacao-unip-2026}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ecopulse_db
    depends_on:
      - db
    networks:
      - ecopulse_net
    # A porta 8000 NÃO é exposta para o host externo por segurança; apenas na rede interna Docker

  # 3. Banco de Dados Relacional (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: ecopulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecopulse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecopulse_net
    # A porta 5432 NÃO é exposta externamente por segurança; acessível apenas pela API

networks:
  ecopulse_net:
    driver: bridge

volumes:
  postgres_data:
